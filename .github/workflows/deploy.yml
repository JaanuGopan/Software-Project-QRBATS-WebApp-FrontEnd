name: Deploy SkyTicker Frontend

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.set-build-path.outputs.build-path }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Set build path output
        id: set-build-path
        run: echo "::set-output name=build-path::dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '${{ needs.build.outputs.build-path }}/*'
          target: ${{ secrets.REMOTE_PATH }}
